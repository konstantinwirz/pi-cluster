- name: Set up monitoring
  hosts: master
  become: false
  gather_facts: false

  vars_files:
    - ../config.yaml

  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:

    - name: Add prometheus-community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "{{ kube_prometheus_stack_version }}"
        release_namespace: monitoring
        create_namespace: true
        wait: true
        update_repo_cache: true
        force_conflicts: true
        values:
          grafana:
            strategy:
              type: Recreate
            grafana.ini:
              auth:
                disable_login_form: true
              auth.anonymous:
                enabled: true
                org_role: Admin
            persistence:
              enabled: true
              storageClassName: longhorn
              size: 2Gi
            ingress:
              enabled: true
              hosts:
                - grafana.picakelab.net
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
              tls:
                - secretName: grafana-tls
                  hosts:
                    - grafana.picakelab.net
          prometheus:
            ingress:
              enabled: true
              hosts:
                - prometheus.picakelab.net
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
              tls:
                - secretName: prometheus-tls
                  hosts:
                    - prometheus.picakelab.net
            prometheusSpec:
              externalUrl: https://prometheus.picakelab.net
              retention: 15d
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 10Gi
          alertmanager:
            ingress:
              enabled: true
              hosts:
                - alertmanager.picakelab.net
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
              tls:
                - secretName: alertmanager-tls
                  hosts:
                    - alertmanager.picakelab.net
            alertmanagerSpec:
              externalUrl: https://alertmanager.picakelab.net
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 1Gi
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeEtcd:
            enabled: false
          kubeProxy:
            enabled: false
          defaultRules:
            rules:
              etcd: false
              kubeProxy: false
              kubeSchedulerAlerting: false
              kubeSchedulerRecording: false
              kubeControllerManager: false

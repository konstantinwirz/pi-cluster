apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
# No selector: traffic goes to the Jellyfin instance on the Synology NAS,
# listed in the EndpointSlice below.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-nas
  namespace: jellyfin
  labels:
    app: jellyfin
    kubernetes.io/service-name: jellyfin
    endpointslice.kubernetes.io/managed-by: ansible
addressType: IPv4
ports:
  - name: http
    port: 8096
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.180
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.picakelab.net
      http:
        paths:
          - backend:
              service:
                name: jellyfin
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - jellyfin.picakelab.net
      secretName: jellyfin-tls
